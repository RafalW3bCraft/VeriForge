services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/veriforge.db}"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - veriforge-data:/app/data
    restart: unless-stopped

volumes:
  veriforge-data:
