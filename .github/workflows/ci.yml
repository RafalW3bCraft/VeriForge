name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          PYTHON_DOTENV_DISABLED: "true"
        run: python -m pytest -q

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Validate TypeScript and production build
        run: npm --prefix frontend run build

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Audit production frontend dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

  hygiene-and-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked generated files
        run: |
          test -z "$(git ls-files -ci --exclude-standard)"

      - name: Scan committed files for high-confidence secret formats
        run: |
          if git grep -nEI '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' -- .; then
            echo "Potential secret material found in tracked files"
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container
        run: docker build -t veriforge-ci .

      - name: Start container and verify readiness
        run: |
          docker run -d --name veriforge-ci -p 18000:8000 -e DEMO_MODE=true veriforge-ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18000/ready; then exit 0; fi
            sleep 1
          done
          docker logs veriforge-ci
          exit 1
